name: pages
# Publishes the game (Dispatch game chain + Fuji C-Chain escrow) to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Public testnet config only (contract addresses and RPC URLs). Regenerate with `npm run config:testnet`
      # after a redeploy, then copy web/public/config.json to web/deploy/config.testnet.json.
      - run: cp web/deploy/config.testnet.json web/public/config.json
      - run: npx vite build web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
